# autonomist: the site, the chat agent, saved results and the agent's own atproto PDS, as one Worker.
# Deploy: `npx wrangler deploy` (runs the build first). Local: `npx wrangler dev`.
name = "autonomist"
main = "worker/main.js"
compatibility_date = "2026-09-01"
account_id = "543fde7feabd0af945bfae926ceea7ad"
# Keep variables set in the dashboard that this file doesn't list, so a deploy never wipes one
# entered there as plain text. (Secrets are always kept.)
keep_vars = true

# Two hostnames. The site, and autonomist's PDS (worker/main.js sends HOSTNAME to pds.js).
routes = [
  { pattern = "autonomist.jason-edelman.org", custom_domain = true },
  { pattern = "pds.autonomist.jason-edelman.org", custom_domain = true },
]

# autonomist on Bluesky (worker/bot/): every five minutes it answers replies and mentions and reads a few of Jason's
# follows for links; hourly (at :07) it does the slow work: the journal entry, questions on its feed, the opt-in sweep.
[triggers]
crons = ["*/5 * * * *", "7 * * * *"]

# The journal's first entry is the bot's example of form and voice; Markdown is imported as text.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# The site is built into public/ before every deploy (scripts/build.mjs).
[build]
command = "node scripts/build.mjs"

# Static pages are served through the Worker so every response gets the same security headers.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[vars]
PUBLIC_ORIGIN = "https://autonomist.jason-edelman.org"
MODEL = "claude-haiku-5-5"
EFFORT = "high"
MAX_STEPS = "6"
MAX_TOKENS = "8000"
# Questions per invite per UTC day, and the whole site's model spend per UTC day (USD).
PER_INVITE_DAILY = "30"
DAILY_BUDGET_USD = "3"
# Outside requests (the data portal) per answer.
SUBREQUEST_BUDGET = "40"
# The chat is invite-only unless this is "false".
INVITE_REQUIRED = "true"
# The PDS (pds.js reads these names).
HOSTNAME = "pds.autonomist.jason-edelman.org"
RELAY_URL = "https://bsky.network"
APPVIEW_URL = "https://api.bsky.app"
APPVIEW_DID = "did:web:api.bsky.app"
# The bot (worker/bot/). Off unless BOT_ENABLED is "true".
BOT_ENABLED = "true"
BOT_HANDLE = "autonomist.jason-edelman.org"
# Whose follows are the journal's sources (Jason, 2026-11-23: "starting with my follows").
BOT_SOURCE_ACTOR = "jason-edelman.org"
# The journal is written from this UTC hour on (13 = 8 AM New York in winter), once a day.
BOT_JOURNAL_HOUR_UTC = "13"
# Problem-posing questions on its own feed, one at each of these UTC hours (16, 20 = 11 AM, 3 PM New York in winter).
BOT_QUESTION_HOURS_UTC = "16,20"
# The bot's own model spend per UTC day (USD), inside the site's DAILY_BUDGET_USD.
BOT_DAILY_BUDGET_USD = "1"
BOT_REPLIES_PER_TICK = "6"
BOT_REPLIES_DAILY = "150"
BOT_OPTIN_DAILY = "10"
BOT_OPTIN_PER_RUN = "20"
BOT_SWEEP_PER_TICK = "8"
# Web searches for fact-checks per UTC day ($0.01 each, inside BOT_DAILY_BUDGET_USD). "0" turns search off.
BOT_SEARCHES_DAILY = "30"
# Fact-checks in one cron run (each up to three searches and six page reads, read in parallel).
BOT_CHECKS_PER_RUN = "3"
# Notes written or refreshed per hourly run, on the people who like the pinned post (acquaint.js).
BOT_ACQUAINT_PER_RUN = "3"

# Storage for invites, the access-request list, limits, spend, saved results and case-study
# proposals. Created by Jason 2026-11-20. Without it the site still serves pages, but the chat
# refuses (it fails closed).
[[kv_namespaces]]
binding = "KV"
id = "9f7312ae8d65430cbd61411205e6359d"

# The steward's page (/admin/), behind Cloudflare Access. Set in the dashboard (kept on deploy):
#   ACCESS_TEAM_DOMAIN  your team's domain, e.g. "<team>.cloudflareaccess.com"
#   ACCESS_AUD          the Access application's Audience (AUD) tag
#   ADMIN_EMAILS        optional, comma-separated: only these Access identities may act
# Until the first two are set, /admin and /api/admin answer 404.

# Secrets (never in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put INVITE_SECRET   # any long random string; signs invite cookies
#   npx wrangler secret put IP_SALT         # any random string; hashes visitors for limits
#   npx wrangler secret put PDS_PASSWORD    # the PDS account's password. Set it BEFORE the first
#                                           # deploy with the PDS: until the account exists, it is
#                                           # what gates /init, which is open without it.
#   npx wrangler secret put JWT_SECRET      # signs the PDS's session tokens

# autonomist's own atproto account, on a PDS it runs itself: pds.js (MIT, @pdsjs/cloudflare).
# One account, the agent's. Its handle is autonomist.jason-edelman.org.
[[durable_objects.bindings]]
name = "PDS"
class_name = "PDSDurableObject"

[[migrations]]
tag = "pds-v1"
new_sqlite_classes = ["PDSDurableObject"]

# Blobs (images), and the scheduled backups pds.js writes. Separate buckets: the backup retention
# policy deletes freely inside its own.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "autonomist-pds-blobs"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "autonomist-pds-backups"

# @pdsjs/account-ui isn't on npm (pds.js 2.5.2); this stub stands in for it. See the file.
[alias]
"@pdsjs/account-ui" = "./worker/account-ui-stub.js"

# Console output only: no invocation logs (they would carry request URLs and headers).
[observability]
enabled = true
[observability.logs]
invocation_logs = false
